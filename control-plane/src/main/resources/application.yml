spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/agent_orchestrator}
    username: ${DATABASE_USER:agent_orchestrator}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:https://invalid.example/issuer}
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
