spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/agent_orchestrator}
    username: ${DATABASE_USER:agent_orchestrator}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:https://invalid.example/issuer}
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
app:
  identity:
    user-pool-id: ${COGNITO_USER_POOL_ID:}
    region: ${APP_AWS_REGION:us-east-1}
  security:
    public-base-url: ${PUBLIC_BASE_URL:}
    cognito-domain: ${COGNITO_DOMAIN:}
    human-client-id: ${HUMAN_CLIENT_ID:}
    bridge-client-id: ${BRIDGE_CLIENT_ID:}
    mcp-client-id: ${MCP_CLIENT_ID:}
    required-scope: ${API_SCOPE:agent-orchestrator/api}
    audience: ${API_AUDIENCE:}
  mcp:
    allowed-origins: ${APP_MCP_ALLOWED_ORIGINS:}
management:
  endpoints:
    web:
      exposure:
        include: health,info
