AWSTemplateFormatVersion: '2010-09-09'
Description: Agent Orchestrator HTTPS API, Cognito, Fargate, and private PostgreSQL.
Parameters:
  Name:
    Type: String
    Default: agent-orchestrator
    AllowedPattern: '[a-z][a-z0-9-]*'
  DomainName:
    Type: String
    Description: Public hostname, for example agents.example.com.
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
  RepositoryUri:
    Type: String
    Description: RepositoryUri output from the build stack.
  ImageTag:
    Type: String
    Description: Immutable 12-character Git commit tag produced by CodeBuild.
    AllowedPattern: '[0-9a-f]{12}'
  BridgeCallbackUrl:
    Type: String
    Default: http://127.0.0.1:8765/callback
  McpCallbackUrls:
    Type: CommaDelimitedList
    Description: Exact callback URLs registered for MCP clients.
    Default: http://127.0.0.1:8766/callback
  AdditionalMcpOrigins:
    Type: String
    Default: ''
    Description: Optional comma-separated browser origins in addition to this API origin.
  DatabaseInstanceClass:
    Type: String
    Default: db.t4g.micro
  DesiredCount:
    Type: Number
    Default: 2
    MinValue: 1
  BudgetEmail:
    Type: String
    Default: ''
  BudgetLimitUsd:
    Type: Number
    Default: 10
    MinValue: 1
Conditions:
  HasBudgetEmail: !Not [!Equals [!Ref BudgetEmail, '']]
  HasAdditionalMcpOrigins: !Not [!Equals [!Ref AdditionalMcpOrigins, '']]
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Ref Name
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
  DatabaseSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.10.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
  DatabaseSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.11.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable
  PublicAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTPS and HTTP redirect
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: API traffic only from ALB
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSecurityGroup
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL traffic only from API tasks
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ServiceSecurityGroup
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private PostgreSQL subnets
      SubnetIds: [!Ref DatabaseSubnetA, !Ref DatabaseSubnetB]
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: '17.11'
      DBInstanceClass: !Ref DatabaseInstanceClass
      AllocatedStorage: '20'
      MaxAllocatedStorage: 100
      StorageType: gp3
      StorageEncrypted: true
      DBName: agent_orchestrator
      MasterUsername: agent_orchestrator
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 7
      DeletionProtection: true
      AutoMinorVersionUpgrade: true
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Ref Name
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      DeletionProtection: ACTIVE
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub '${Name}-${AWS::AccountId}'
      UserPoolId: !Ref UserPool
  ApiResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      Identifier: !Sub 'https://${DomainName}'
      Name: Agent Orchestrator API
      UserPoolId: !Ref UserPool
      Scopes:
        - ScopeName: api
          ScopeDescription: Read and coordinate projects
  HumanClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: ApiResourceServer
    Properties:
      ClientName: !Sub '${Name}-human'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes:
        - openid
        - profile
        - email
        - !Sub 'https://${DomainName}/api'
      CallbackURLs: [!Sub 'https://${DomainName}/']
      LogoutURLs: [!Sub 'https://${DomainName}/']
      SupportedIdentityProviders: [COGNITO]
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        RefreshToken: days
  BridgeClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: ApiResourceServer
    Properties:
      ClientName: !Sub '${Name}-bridge'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes:
        - openid
        - profile
        - email
        - !Sub 'https://${DomainName}/api'
      CallbackURLs: [!Ref BridgeCallbackUrl]
      SupportedIdentityProviders: [COGNITO]
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        RefreshToken: days
  McpClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: ApiResourceServer
    Properties:
      ClientName: !Sub '${Name}-mcp'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes:
        - openid
        - profile
        - email
        - !Sub 'https://${DomainName}/api'
      CallbackURLs: !Ref McpCallbackUrls
      SupportedIdentityProviders: [COGNITO]
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        RefreshToken: days
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      SecurityGroups: [!Ref AlbSecurityGroup]
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /actuator/health
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Port: '443'
            Protocol: HTTPS
            StatusCode: HTTP_301
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref Certificate
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup
  DnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID
        EvaluateTargetHealth: true
  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${Name}'
      RetentionInDays: 14
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-database-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !GetAtt Database.MasterUserSecret.SecretArn
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref Name
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref Name
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: control-plane
          Image: !Sub '${RepositoryUri}:${ImageTag}'
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Environment:
            - Name: SPRING_PROFILES_ACTIVE
              Value: prod
            - Name: DATABASE_URL
              Value: !Sub 'jdbc:postgresql://${Database.Endpoint.Address}:5432/agent_orchestrator'
            - Name: DATABASE_USER
              Value: agent_orchestrator
            - Name: OIDC_ISSUER_URI
              Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
            - Name: PUBLIC_BASE_URL
              Value: !Sub 'https://${DomainName}'
            - Name: API_AUDIENCE
              Value: !Sub 'https://${DomainName}'
            - Name: API_SCOPE
              Value: !Sub 'https://${DomainName}/api'
            - Name: COGNITO_DOMAIN
              Value: !Sub 'https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'
            - Name: HUMAN_CLIENT_ID
              Value: !Ref HumanClient
            - Name: BRIDGE_CLIENT_ID
              Value: !Ref BridgeClient
            - Name: MCP_CLIENT_ID
              Value: !Ref McpClient
            - Name: APP_MCP_ALLOWED_ORIGINS
              Value: !If
                - HasAdditionalMcpOrigins
                - !Sub 'https://${DomainName},${AdditionalMcpOrigins}'
                - !Sub 'https://${DomainName}'
          Secrets:
            - Name: DATABASE_PASSWORD
              ValueFrom: !Sub '${Database.MasterUserSecret.SecretArn}:password::'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AppLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: control-plane
  Service:
    Type: AWS::ECS::Service
    DependsOn: HttpsListener
    Properties:
      Cluster: !Ref Cluster
      ServiceName: !Ref Name
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        MinimumHealthyPercent: 50
        MaximumPercent: 200
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups: [!Ref ServiceSecurityGroup]
          Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      LoadBalancers:
        - ContainerName: control-plane
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: HasBudgetEmail
    Properties:
      Budget:
        BudgetName: !Sub '${Name}-monthly'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref BudgetLimitUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
Outputs:
  PublicUrl:
    Value: !Sub 'https://${DomainName}'
  McpUrl:
    Value: !Sub 'https://${DomainName}/mcp'
  CognitoDomain:
    Value: !Sub 'https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'
  OidcIssuer:
    Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
  UserPoolId:
    Value: !Ref UserPool
  HumanClientId:
    Value: !Ref HumanClient
  BridgeClientId:
    Value: !Ref BridgeClient
  McpClientId:
    Value: !Ref McpClient
  ApiScope:
    Value: !Sub 'https://${DomainName}/api'
